name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0 or v0.1.0)"
        required: true
        type: string
permissions:
  contents: write
jobs:
  build-amd64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ensure python3.13 alias
        run: |
          if ! command -v python3.13 >/dev/null 2>&1; then
            sudo ln -sf "$(which python)" /usr/local/bin/python3.13
          fi
      - name: Normalize version input
        id: ver
        run: |
          ver="${{ inputs.version }}"
          ver="${ver#v}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Verify version matches config.py
        run: |
          v="$(python -c 'import re, pathlib; txt=pathlib.Path("config.py").read_text(); m=re.search(r"^VERSION\s*=\s*\"v?([^\"]+)\"", txt, re.M); print(m.group(1) if m else "")')"
          if [ "$v" != "${{ steps.ver.outputs.version }}" ]; then
            echo "config.py VERSION=v$v does not match input version=${{ inputs.version }}"
            exit 1
          fi
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build
        run: bash build/build.sh
      - name: Upload amd64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostnode-amd64
          path: |
            dist/ghostnode
            dist/ghostnode.sha256
            dist/ghostnode-client
            dist/ghostnode-client.sha256
  build-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ensure python3.13 alias
        run: |
          if ! command -v python3.13 >/dev/null 2>&1; then
            sudo ln -sf "$(which python)" /usr/local/bin/python3.13
          fi
      - name: Normalize version input
        id: ver
        run: |
          ver="${{ inputs.version }}"
          ver="${ver#v}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build arm64
        run: |
          python3.13 -m PyInstaller --onefile --name ghostnode-arm64 \
            --add-data "panel/frontend:panel/frontend" \
            --hidden-import transport.websocket \
            --hidden-import transport.http_request \
            --hidden-import transport.http_request_sse \
            --hidden-import transport.http_request_body \
            --hidden-import transport.http2 \
            --hidden-import transport.grpc \
            main.py
          python3.13 -m PyInstaller --onefile --name ghostnode-client-arm64 \
            --hidden-import transport.websocket \
            --hidden-import transport.http_request \
            --hidden-import transport.http_request_sse \
            --hidden-import transport.http_request_body \
            --hidden-import transport.http2 \
            --hidden-import transport.grpc \
            --hidden-import core.protocol \
            --hidden-import core.crypto \
            --hidden-import client.connector \
            --hidden-import client.socks5 \
            client/main.py
          cd dist
          sha256sum ghostnode-arm64 > ghostnode-arm64.sha256
          sha256sum ghostnode-client-arm64 > ghostnode-client-arm64.sha256
      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghostnode-arm64
          path: |
            dist/ghostnode-arm64
            dist/ghostnode-arm64.sha256
            dist/ghostnode-client-arm64
            dist/ghostnode-client-arm64.sha256
  release:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Normalize version input
        id: ver
        run: |
          ver="${{ inputs.version }}"
          ver="${ver#v}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Download amd64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: ghostnode-amd64
          path: dist/
      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: ghostnode-arm64
          path: dist/
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          artifacts: >
            dist/ghostnode,
            dist/ghostnode.sha256,
            dist/ghostnode-arm64,
            dist/ghostnode-arm64.sha256,
            dist/ghostnode-client,
            dist/ghostnode-client.sha256,
            dist/ghostnode-client-arm64,
            dist/ghostnode-client-arm64.sha256
          allowUpdates: true
          generateReleaseNotes: true
